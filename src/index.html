function dealInfo(x){
 if(x.current==null||x.avg3==null||!x.n3)return null;
 const pct=Math.round((x.current/x.avg3-1)*100),abs=Math.abs(pct);
 let label,cls='';
 if(pct<=-15){label='아주 쌈';cls='deal-hot'}
 else if(pct<=-5){label='싼 편';cls='deal-hot'}
 else if(pct<5){label='평균 수준'}
 else if(pct<15){label='비싼 편';cls='deal-cool'}
 else{label='많이 비쌈';cls='deal-cool'}
 const comparison=pct===0?'평균과 같음':`평균보다 ${abs}% ${pct<0?'낮음':'높음'}`;
 const sample=x.n3<5?` · 표본 적음 n=${x.n3}`:` · n=${x.n3}`;
 return {label,cls,detail:comparison+sample};
}
function deal(x){
 const info=dealInfo(x);
 return info?`<span class="pill ${info.cls}">${info.label}</span><div class="deal-detail">${info.detail}</div>`:'—';
}
function priceCell(label,p,u){
 return `<div class="price-cell"><span class="price-label">${label}</span><span class="price-value">${link(p,u)}</span></div>`;
}
function card(x){
 const info=dealInfo(x),title=`${x.model} ${x.variant}`;
 const current=x.current==null?'<span class="current-missing">판매중 매물 없음</span>':x.currentUrl?`<a class="current-link" href="${esc(x.currentUrl)}" target="_blank" rel="noopener" aria-label="${esc(title)} 판매중 최저가 ${won(x.current)} 매물 보기">${won(x.current)}</a>`:`<span class="current-link">${won(x.current)}</span>`;
 return `<article class="product-card">
 <div class="product-head"><div><div class="product-brand">${esc(x.brand)}</div><div class="product-title">${esc(x.model)} · ${esc(x.variant)}</div></div>${info?`<span class="pill ${info.cls}">${info.label}</span>`:''}</div>
 <div class="current-row">${current}</div>
 ${info?`<div class="deal-mobile-detail">3개월 평균보다 ${info.detail.replace('평균보다 ','').split(' · ')[0]} · n=${x.n3}${x.n3<5?' (표본 적음)':''}</div>`:''}
 <div class="price-grid">
  ${priceCell('판매중 최저가',x.current,x.currentUrl)}${priceCell('판매중-안전',x.safe,x.safeUrl)}${priceCell('6개월 최저가',x.low6,x.low6Url)}${priceCell('3개월 평균가',x.avg3,null)}
 </div>
 <div class="card-foot"><span aria-hidden="true">${(x.safety||'').includes('주의')?'⚠️':'✓'}</span><span class="card-safety">${esc(x.safety||'—')}</span></div>
 ${x.note?`<p class="card-note">${esc(x.note)}</p>`:''}
 </article>`;
}
function render(){
 const term=q.value.trim().toLowerCase();
 let xs=DATA.filter(x=>(!term||(`${x.model} ${x.variant} ${x.brand}`).toLowerCase().includes(term))&&(!brand.value||x.brand===brand.value));
 if(safety.value==='주의') xs=xs.filter(x=>(x.safety||'').includes('주의'));
 if(safety.value==='safe') xs=xs.filter(x=>x.safe!=null);
 if(sort.value==='price') xs=xs.map((x,index)=>({x,index})).sort((a,b)=>(a.x.current??Infinity)-(b.x.current??Infinity)||a.index-b.index).map(v=>v.x);
 count.textContent=`${xs.length}개 구성`;
 body.innerHTML=xs.map(x=>`<tr>
 <td><span class="pill">${esc(x.brand)}</span></td>
 <td class="model">${esc(x.model)}<div class="muted">${esc(x.variant)}</div></td>
 <td class="price">${link(x.current,x.currentUrl)}</td>
 <td class="price">${link(x.safe,x.safeUrl)}</td>
 <td class="price">${link(x.low6,x.low6Url)}</td>
 <td class="price">${x.avg3==null?'—':won(x.avg3)+` <span class="muted">n=${x.n3}</span>`}</td>
 <td>${deal(x)}</td>
 <td><span class="pill ${(x.safety||'').includes('주의')?'warn':''}">${esc(x.safety||'—')}</span></td>
 <td class="note">${esc(x.note||'')}</td></tr>`).join('');
 cards.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty mobile-empty">조건에 맞는 항목이 없습니다.</div>';
 empty.hidden=xs.length>0;
}
[q,sort,brand,safety].forEach(el=>el.addEventListener('input',render));
document.querySelector('#reset').onclick=()=>{q.value='';sort.value='catalog';brand.value='';safety.value='';render()};
render();
</script>
</body></html>
