const won=v=>v==null?'—':new Intl.NumberFormat('ko-KR').format(v)+'원';
const q=document.querySelector('#q'),brand=document.querySelector('#brand'),safety=document.querySelector('#safety'),body=document.querySelector('#body'),count=document.querySelector('#count'),empty=document.querySelector('#empty');
[...new Set(DATA.map(x=>x.brand))].forEach(b=>brand.insertAdjacentHTML('beforeend',`<option>${b}</option>`));
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function link(p,u){return p==null?'—':u?`<a href="${esc(u)}" target="_blank" rel="noopener">${won(p)}</a>`:won(p)}
function render(){
 const term=q.value.trim().toLowerCase();
 let xs=DATA.filter(x=>(!term||(`${x.model} ${x.variant} ${x.brand}`).toLowerCase().includes(term))&&(!brand.value||x.brand===brand.value));
 if(safety.value==='주의') xs=xs.filter(x=>(x.safety||'').includes('주의'));
 if(safety.value==='safe') xs=xs.filter(x=>x.safe!=null);
 count.textContent=`${xs.length}개 구성`;
 body.innerHTML=xs.map(x=>`<tr>
 <td><span class="pill">${esc(x.brand)}</span></td>
 <td class="model">${esc(x.model)}<div class="muted">${esc(x.variant)}</div></td>
 <td class="price">${link(x.current,x.currentUrl)}</td>
 <td class="price">${link(x.safe,x.safeUrl)}</td>
 <td class="price">${link(x.low6,x.low6Url)}</td>
 <td class="price">${x.avg3==null?'—':won(x.avg3)+` <span class="muted">n=${x.n3}</span>`}</td>
 <td><span class="pill ${(x.safety||'').includes('주의')?'warn':''}">${esc(x.safety||'—')}</span></td>
 <td class="note">${esc(x.note||'')}</td></tr>`).join('');
 empty.hidden=xs.length>0;
}
[q,brand,safety].forEach(el=>el.addEventListener('input',render));
document.querySelector('#reset').onclick=()=>{q.value='';brand.value='';safety.value='';render()};
render();
